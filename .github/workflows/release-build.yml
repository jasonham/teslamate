name: 多架构构建并发布到阿里云

on:
  workflow_dispatch:
  push:
    branches:
      - release

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  NAMESPACE: memories
  IMAGE: teslamate
  REGISTRY_IMAGE: registry.cn-hangzhou.aliyuncs.com/memories/teslamate

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64

          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录阿里云容器镜像服务
        run: |
          echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | docker login \
            --username="${{ secrets.ALIYUN_ACR_USERNAME }}" \
            --password-stdin ${{ env.REGISTRY }}

      - name: 构建并推送单架构镜像
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          docker buildx build \
            --platform ${{ matrix.platform }} \
            -t ${{ env.REGISTRY_IMAGE }}:latest-${{ matrix.suffix }} \
            -t ${{ env.REGISTRY_IMAGE }}:${SHORT_SHA}-${{ matrix.suffix }} \
            --push \
            .

  merge:
    name: Create Multi-Arch Manifest
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 登录阿里云容器镜像服务
        run: |
          echo "${{ secrets.ALIYUN_ACR_PASSWORD }}" | docker login \
            --username="${{ secrets.ALIYUN_ACR_USERNAME }}" \
            --password-stdin ${{ env.REGISTRY }}

      - name: 创建 multi-arch 镜像
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)

          # latest
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:latest \
            ${{ env.REGISTRY_IMAGE }}:latest-amd64 \
            ${{ env.REGISTRY_IMAGE }}:latest-arm64

          # commit tag
          docker buildx imagetools create \
            -t ${{ env.REGISTRY_IMAGE }}:${SHORT_SHA} \
            ${{ env.REGISTRY_IMAGE }}:${SHORT_SHA}-amd64 \
            ${{ env.REGISTRY_IMAGE }}:${SHORT_SHA}-arm64
